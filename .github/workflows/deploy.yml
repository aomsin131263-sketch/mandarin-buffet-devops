name: Mandarin Buffet CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  kitchen-qc-and-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Test Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker Image
        run: |
          cd frontend
          docker build -t mandarin-buffet-frontend .